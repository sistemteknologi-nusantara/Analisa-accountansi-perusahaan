<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Pengaturan tampilan sempurna di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Tambahan untuk jadi Aplikasi Web -->
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Aplikasi Web Saya</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1e293b;
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .tombol {
            background: linear-gradient(90deg, #007bff, #0056d2);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 17px;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .tombol:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        .tombol:active {
            transform: translateY(0);
        }

        .info-bawah {
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">📱</div>
        <h1>Halo Sahabat!</h1>
        <p>Ini aplikasi buatanmu sendiri, lengkap dan aman. Bisa dibuka lewat peramban atau diubah langsung jadi berkas APK.</p>
        
        <button class="tombol" onclick="mulaiAplikasi()">Tekan untuk Mulai</button>
    </div>

    <p class="info-bawah">© 2026 Dibuat Khusus • Semua Hak Dilindungi</p>

    <script>
        function mulaiAplikasi() {
            alert("✅ Berhasil terhubung!");
            console.log("Aplikasi berjalan lancar");
        }
    </script>

</body>
</html>
